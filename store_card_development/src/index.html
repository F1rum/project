<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Скидочные карты</title>
    <link rel="stylesheet" href="/styles.css">
</head>
 <body>
    <main>
        <div id="app">
            <!-- Карточки магазинов -->
            <div class="cards-container">
                <div v-for="card in cards" :key="card.id" class="card">
                    <img :src="card.image" alt="Логотип магазина" class="card-img">
                </div>
            </div>
    
            <!-- Кнопка для добавления карты -->
            <button id="modal_card" @click="openModal" @touchstart="handleTouchStart" @touchend="handleTouchEnd">
                <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" class="bi bi-file-plus" viewBox="0 0 16 16" 
                style="width: 80px;height: 80px; transform: rotate(90deg);">
                    <path d="M8.5 6a.5.5 0 0 0-1 0v1.5H6a.5.5 0 0 0 0 1h1.5V10a.5.5 0 0 0 1 0V8.5H10a.5.5 0 0 0 0-1H8.5z"/>
                    <path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2zm10-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1"/>
                  </svg>
            </button>
    
            <!-- Модальное окно -->
            <transition name="slide">
                <div v-if="isModalOpen" class="modal-overlay">
                    <div class="modal">
                        <div class="modal-header">
                            <h2>Добавить карту</h2>
                            <button class="close-btn" @click="closeModal">✖</button>
                        </div>
                        <div class="modal-body">
                            <h4 style="margin-top: 0px; margin-bottom: 5px;">Выберите магазин:</h4>
                            <select v-model="selectedStore" class="form-select">
                                <option v-for="store in availableStores" :key="store.name" :value="store.name">
                                    {{ store.name }}
                                </option>
                            </select>                            
                        </div>
                        <div class="modal-footer">
                            <button class="btn btn-add" @click="addCard">Добавить</button>
                        </div>
                    </div>
                </div>
            </transition>
        </div>
    </main>
    <footer>
     <nav class="bottom-nav">
      <button class="nav-btn">🏠</button>
       <button class="nav-btn active">💳</button>
      <button class="nav-btn">🛒</button>
     </nav>
    </footer>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="/main.js"></script>
 </body>
</html>
